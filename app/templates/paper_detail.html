<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Detail - PaperRecommender</title>
    <!-- Plotly removed -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa; color: #1a1a2e; line-height: 1.6;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        nav {
            background: #1a1a2e; padding: 15px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        nav .container { display: flex; align-items: center; justify-content: space-between; }
        nav a { color: #e0e0e0; text-decoration: none; font-weight: 500; }
        nav a:hover { color: #fff; }
        .brand { font-size: 1.3rem; font-weight: 700; color: #fff !important; }
        .btn {
            display: inline-block; padding: 10px 20px;
            background: #4361ee; color: #fff; border: none; border-radius: 6px;
            font-size: 0.95rem; cursor: pointer; text-decoration: none;
        }
        .btn:hover { background: #3a56d4; }
        .btn-outline {
            background: transparent; border: 1px solid #4361ee; color: #4361ee;
        }
        .btn-outline:hover { background: #4361ee; color: #fff; }
        .card {
            background: #fff; border-radius: 8px; padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 15px;
        }
        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 0.8rem; background: #eef0ff; color: #4361ee; margin-right: 5px;
        }
        .text-muted { color: #666; font-size: 0.9rem; }
        .text-small { font-size: 0.85rem; }
        .mt-10 { margin-top: 10px; }
        .mt-20 { margin-top: 20px; }
        .mb-20 { margin-bottom: 20px; }
        .flex { display: flex; }
        .gap-10 { gap: 10px; }
        h1 { font-size: 1.8rem; line-height: 1.3; }
        .footer { text-align: center; color: #999; padding: 40px 0; font-size: 0.85rem; }
        .back-link { color: #4361ee; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .abstract-text {
            background: #f8f9fc; padding: 16px; border-radius: 6px;
            border-left: 3px solid #4361ee; line-height: 1.7;
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="brand">PaperRecommender</a>
            <div><a href="/">Home</a></div>
        </div>
    </nav>

    <div class="container">
        <a href="javascript:history.back()" class="back-link">&larr; Back</a>

        <div class="card mt-20">
            <h1>{{ paper.title }}</h1>

            <p class="mt-10 text-muted"><strong>Paper ID:</strong> {{ paper.id }}</p>

            <p class="mt-10"><strong>Authors:</strong> {{ paper.authors }}</p>

            <div class="mt-10">
                {% for cat in paper.categories.split() %}
                    <span class="badge">{{ cat }}</span>
                {% endfor %}
            </div>

            <h3 class="mt-20 mb-10">Abstract</h3>
            <div class="abstract-text">
                {{ paper.abstract }}
            </div>

            <div class="flex gap-10 mt-20">
                <a href="/recommend/{{ paper.id }}" class="btn">
                    Find Similar Papers
                </a>
                <a href="/cluster/{{ paper.id }}" class="btn btn-outline">
                    View on Cluster Map
                </a>
            </div>
        </div>
    </div>

    <div class="footer">
        Research Paper Recommender System &mdash; ArXiv Dataset
    </div>
</body>
</html>
