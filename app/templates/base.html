<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Research Paper Recommender{% endblock %}</title>
    <!-- Plotly removed: cluster map uses inline SVG now -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            color: #1a1a2e;
            line-height: 1.6;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        nav {
            background: #1a1a2e;
            padding: 15px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        nav .container { display: flex; align-items: center; justify-content: space-between; }
        nav a { color: #e0e0e0; text-decoration: none; font-weight: 500; }
        nav a:hover { color: #fff; }
        .brand { font-size: 1.3rem; font-weight: 700; color: #fff !important; }
        .btn {
            display: inline-block; padding: 10px 20px;
            background: #4361ee; color: #fff; border: none; border-radius: 6px;
            font-size: 0.95rem; cursor: pointer; text-decoration: none;
        }
        .btn:hover { background: #3a56d4; }
        .btn-outline {
            background: transparent; border: 1px solid #4361ee; color: #4361ee;
        }
        .btn-outline:hover { background: #4361ee; color: #fff; }
        .card {
            background: #fff; border-radius: 8px; padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 15px;
        }
        .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.12); }
        .badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 0.8rem; background: #eef0ff; color: #4361ee;
        }
        .search-box {
            display: flex; gap: 10px; max-width: 600px; margin: 30px auto;
        }
        .search-box input {
            flex: 1; padding: 14px 18px; border: 2px solid #ddd; border-radius: 8px;
            font-size: 1rem;
        }
        .search-box input:focus { outline: none; border-color: #4361ee; }
        .search-box button { padding: 14px 28px; }
        .text-muted { color: #666; font-size: 0.9rem; }
        .text-small { font-size: 0.85rem; }
        .mt-10 { margin-top: 10px; }
        .mt-20 { margin-top: 20px; }
        .mb-10 { margin-bottom: 10px; }
        .mb-20 { margin-bottom: 20px; }
        .flex { display: flex; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-10 { gap: 10px; }
        h1 { font-size: 1.8rem; }
        h2 { font-size: 1.4rem; }
        h3 { font-size: 1.15rem; }
        .score-bar {
            height: 6px; border-radius: 3px; background: #e0e0e0; margin-top: 6px;
        }
        .score-bar-fill { height: 100%; border-radius: 3px; background: #4361ee; }
        .footer { text-align: center; color: #999; padding: 40px 0; font-size: 0.85rem; }
        @media (max-width: 768px) {
            .search-box { flex-direction: column; }
            .flex-between { flex-direction: column; align-items: start; gap: 10px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="{{ url_for('main.home') }}" class="brand">PaperRecommender</a>
            <div>
                <a href="{{ url_for('main.home') }}">Home</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        Research Paper Recommender System &mdash; ArXiv Dataset
    </div>
</body>
</html>
